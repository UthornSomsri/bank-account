<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ee">
  <title>เลขบัญชีรับโอน - อุทร สมศรี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <header class="head">
      <h1>เลขบัญชีรับโอนเงิน</h1>
      <p class="owner">ชื่อบัญชี <strong>อุทร สมศรี</strong></p>
      <p class="owner-en">Uthorn Somsri</p>
    </header>

    <section class="block" aria-labelledby="h-accounts">
      <h2 id="h-accounts">โอนเข้าบัญชีธนาคาร</h2>

      <ul class="accounts">
        <li class="account">
          <span class="chip chip-bbl" aria-hidden="true">BBL</span>
          <div class="account-info">
            <span class="bank-name">ธนาคารกรุงเทพ</span>
            <span class="acc-no" id="no-bbl" data-raw="0097459374">009-7-45937-4</span>
          </div>
          <button type="button" class="btn-copy" data-copy="no-bbl" aria-label="คัดลอกเลขบัญชีธนาคารกรุงเทพ">คัดลอก</button>
        </li>

        <li class="account">
          <span class="chip chip-kbank" aria-hidden="true">KBank</span>
          <div class="account-info">
            <span class="bank-name">ธนาคารกสิกรไทย</span>
            <span class="acc-no" id="no-kbank" data-raw="1258547523">125-8-54752-3</span>
          </div>
          <button type="button" class="btn-copy" data-copy="no-kbank" aria-label="คัดลอกเลขบัญชีธนาคารกสิกรไทย">คัดลอก</button>
        </li>
      </ul>
    </section>

    <section class="block" aria-labelledby="h-qr">
      <h2 id="h-qr">สแกนจ่ายด้วยพร้อมเพย์</h2>

      <label class="field" for="amount">
        <span class="field-label">จำนวนเงิน (บาท) <em>ไม่ใส่ก็ได้ ผู้โอนกรอกเอง</em></span>
        <span class="field-row">
          <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" maxlength="12">
          <button type="button" id="amount-clear" class="btn-ghost" hidden>ล้าง</button>
        </span>
      </label>

      <div class="qr-card" id="qr-card">
        <img class="pp-logo" id="pp-logo" src="img/PromptPay-logo.png" alt="PromptPay">
        <canvas id="qr" width="560" height="560" role="img" aria-label="QR Code พร้อมเพย์"></canvas>
        <p class="qr-name">อุทร สมศรี</p>
        <p class="qr-amount" id="qr-amount">ไม่ระบุจำนวนเงิน</p>
      </div>

      <button type="button" id="save-img" class="btn-main">บันทึกภาพ QR</button>
      <p class="hint">ใช้แอปธนาคารสแกนได้ทุกธนาคาร ตรวจชื่อผู้รับก่อนกดยืนยันทุกครั้ง</p>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="script.js"></script>
</body>
</html>
